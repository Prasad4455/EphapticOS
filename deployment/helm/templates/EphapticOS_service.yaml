apiVersion: v1
kind: Service
metadata:
  name: {{ include "EphapticOS.fullname" . }}
  labels:
    {{- include "EphapticOS.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "EphapticOS.selectorLabels" . | nindent 4 }}
